services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The app as a production release (see Dockerfile), on http://localhost:4001.
  # Secrets come from .env next to this file; see the README.
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/let_it_crash_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (generate one with mix phx.gen.secret)}
      PHX_HOST: ${PHX_HOST:-localhost}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-letitcrash}
      MDNS_NAMES: ${MDNS_NAMES:-foo.local bar.local}
    ports: ["4001:4000"]
    command: ["sh", "-c", "bin/let_it_crash eval LetItCrash.Release.setup && exec bin/server"]

volumes:
  pgdata:
